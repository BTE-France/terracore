name: Check docs

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: docs/package-lock.json
            - name: Build docs
              run: |
                  pushd docs
                  npm ci --no-audit --no-fund
                  npx astro build
                  popd
[versions]
freefair = "9.8.3"
jetbrains-annotations = "26.1.0"
junit = "6.1.3"
jackson = "2.22.4"
daporkchop-binary = "0.5.7-SNAPSHOT"
gson = "2.15.0"
guava = "33.8.0-jre"
netty = "4.2.20.Final"
log4j = "2.26.1"
spigot = "26.3-R0.1-SNAPSHOT"
commons-imaging = "1.0.0-alpha5"
fastutil = "8.5.19"

[libraries]
annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
daporkchop-binary = { module = "net.daporkchop.lib:binary", version.ref = "daporkchop-binary" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
commons-imaging = { module = "org.apache.commons:commons-imaging", version.ref = "commons-imaging" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
# Plugin marker used to put the Lombok plugin on the buildSrc classpath for the convention plugin
freefair-lombok-plugin = { module = "io.freefair.lombok:io.freefair.lombok.gradle.plugin", version.ref = "freefair" }

[bundles]
log4j = ["log4j-api", "log4j-core"]

[plugins]
freefair-git-version = { id = "io.freefair.git-version", version.ref = "freefair" }
